<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Docker Zero README buttons and icons</title>
<!--
Signature (same as figures.html)
- Concept: a sea poster for a tool that gets Docker running without admin rights; the logo is the letter o, the sea is the ground.
- Shape language: flat fills, no gradients; every icon is the logo's red ring and two-tone sea around one line glyph in ink teal; rounded cards with a flat 2 px line, no shadows.
- Typeface: Figtree for the button labels (Dela Gothic One and JetBrains Mono live in figures.html).
- Palette logic: from the logo. Cream is the paper, ink teal is the glyph, the red ring is the only warm accent, the two teals are the sea. Dark theme: deep teal card, same ring, sea and glyph.
- Presentation: a navigation button is a badge and a label; a section icon is the badge alone.
- Not: a screenshot, a gradient, an emoji, a stock icon set.

Render, from the repository root:
uvx --from playwright --with pillow python -I <skill-dir>/scripts/render.py design/readme/source/icons.html --root . --out design/readme/asset
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
