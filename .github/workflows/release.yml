name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Same version as go.mod and @wailsio/runtime; upgrade all three together.
      - name: Install the Wails CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.30

      # The tag is the only source of the version; the stamp is not committed back.
      # file_version takes digits only, so a suffix such as -alpha stays in ProductVersion.
      - name: Stamp the version
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if ($env:TAG -notmatch '^v(\d+\.\d+\.\d+)(-[0-9A-Za-z.-]+)?$') {
            throw "Tag '$($env:TAG)' is not vX.Y.Z or vX.Y.Z-suffix"
          }
          $path = 'packaging/windows/info.json'
          $info = Get-Content $path -Raw | ConvertFrom-Json
          $info.fixed.file_version = $Matches[1]
          $info.info.'0409'.ProductVersion = $env:TAG.Substring(1)
          $info | ConvertTo-Json -Depth 5 | Set-Content -Path $path -Encoding utf8
          Get-Content $path

      - name: Build
        run: wails3 task build

      # After the build: main.go embeds frontend/dist, which the build creates and git does not track.
      - name: Test
        run: wails3 task test

      - name: Checksum
        run: |
          $hash = (Get-FileHash -Algorithm SHA256 bin/docker-zero.exe).Hash.ToLower()
          "$hash  docker-zero.exe" | Out-File -Encoding ascii bin/docker-zero.exe.sha256
          Get-Content bin/docker-zero.exe.sha256

      # A tag with a suffix such as v0.1.0-alpha is published as a pre-release.
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          $flags = @()
          if ($env:TAG -match '-') { $flags += '--prerelease' }
          gh release create $env:TAG bin/docker-zero.exe bin/docker-zero.exe.sha256 --title $env:TAG --generate-notes @flags
